<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="scripts/templates.js"></script>
    <script src="scripts/products.js"></script>
    <script src="scripts/script.js"></script>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./basket.css" />
    <title>DeliveryApp</title>
  </head>
  <body onload="init()">
    <header>
      <div class="header-wrapper">
        <div class="header-logo">
          <a href="index.html" aria-label="Home Button"
            ><img src="./assets/icon/Logo.png" alt="Logo and Home Button"
          /></a>
        </div>

        <div class="burger-menu">
          <a href="" aria-label="Burger Menu"
            ><img src="./assets/icon/burger-menu.png" alt="Burger Menu"
          /></a>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-image">
          <img
            src="./assets/img/hero.jpg"
            alt="Image of Pizza and Burger from the Sortiment"
          />
        </div>
        <div class="profile-picture">
          <img
            src="./assets/img/ProfilePicture.jpg"
            alt="Profile Picture BurgerHouse"
          />
        </div>
        <div class="rating">
          <img src="./assets/icon/star.png" alt="Rating-Star" />
          <p><strong>4,1 </strong><span style="color: #726d6d">(317)</span></p>
        </div>
        <h1><span style="color: #e76c1f">Burger</span>House</h1>
        <h4>The best of Burgers, Pizza and Greens, all in one great place.</h4>
      </section>

      <section class="confirmation">
        <div class="close-confirmation">X</div>
        <img src="./assets/icon/delivery.png" alt="Delivery Icon" />
        <h2>Order confirmed!</h2>
        <h3>Your food is on the way!</h3>
      </section>

      <section id="basket">
        <div class="basket">
          <div class="close-basket">X</div>
          <h2>Your Basket</h2>
          <div id="basket-scroll-wrapper" class="basket-scroll-wrapper"></div>

          <div class="basket-summary">
            <div class="summary-wrapper">
              <div class="summary-row">
                <div class="summary-label">Subtotal</div>
                <div class="summary-value" id="subtotal">36,70€</div>
              </div>

              <div class="summary-row">
                <div class="summary-label">Delivery fee</div>
                <div class="summary-value" id="delivery-fee">4,99€</div>
              </div>

              <div class="summary-line"></div>

              <div class="summary-row summary-total">
                <div class="summary-label">Total</div>
                <div class="summary-value" id="total">41,69€</div>
              </div>
            </div>
            <button class="buy-button" id="buy-button" type="button">
              Buy now (41,69€)
            </button>
          </div>
        </div>
        ;
      </section>

      <section class="category-section">
        <img src="./assets/icon/burger.png" alt="Burger Icon" />
        <h2>Burger</h2>
        <div id="burger-cards" class="meal-card-wrapper"></div>
      </section>

      <section class="category-section">
        <img src="./assets/icon/Pizza.png" alt="Pizza Icon" />
        <h2>Pizza</h2>
        <div id="pizza-cards" class="meal-card-wrapper"></div>
      </section>

      <section class="category-section">
        <img src="./assets/icon/Salad.png" alt="Salad Icon" />
        <h2>Salad</h2>

        <div id="salad-cards" class="meal-card-wrapper"></div>
      </section>
    </main>

    <footer>
      <a href="">Imprint</a>
      <a href="">Cookie Preferences</a>
      <a href="">
        <img src="./assets/icon/copyright.png" alt="copyright" /> 2025
        BurgerHouse</a
      >
    </footer>

    <nav>
      <a href="index.html"
        ><img src="./assets/icon/home-inactive.png" alt="Home Button"
      /></a>
      <a href="index.html"
        ><img src="./assets/icon/account-inactive.png" alt="Profile Button"
      /></a>
      <a href="index.html"
        ><img src="./assets/icon/takeaway-inactive.png" alt="Your Order"
      /></a>
      <a href="index.html"
        ><img src="./assets/icon/basket-inactive.png" alt="Your Basket"
      /></a>
    </nav>
  </body>
</html>
